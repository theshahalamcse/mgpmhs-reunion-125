<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Our Honourable Teachers</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=Lato:wght@300;400;700&display=swap" rel="stylesheet">
<style>
  :root {
    --gold: #c9a84c;
    --gold-light: #e8cc7a;
    --dark: #0d1117;
    --dark-card: #161b22;
    --dark-border: #21262d;
    --text-main: #e6edf3;
    --text-muted: #8b949e;
    --accent: #58a6ff;
    --shadow-gold: rgba(201,168,76,0.25);
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background-color: var(--dark);
    color: var(--text-main);
    font-family: 'Lato', sans-serif;
    min-height: 100vh;
    overflow-x: hidden;
  }

  /* ── Animated background ── */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background:
      radial-gradient(ellipse 80% 50% at 20% 10%, rgba(201,168,76,0.07) 0%, transparent 60%),
      radial-gradient(ellipse 60% 40% at 80% 80%, rgba(88,166,255,0.05) 0%, transparent 55%);
    pointer-events: none;
    z-index: 0;
  }

  /* ── Header ── */
  header {
    position: relative;
    z-index: 1;
    text-align: center;
    padding: 60px 20px 40px;
  }

  .school-badge {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    background: linear-gradient(135deg, #1a1f2e, #0d1117);
    border: 1px solid var(--gold);
    border-radius: 50px;
    padding: 8px 22px;
    margin-bottom: 28px;
    font-size: 0.78rem;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: var(--gold-light);
    box-shadow: 0 0 20px var(--shadow-gold);
  }

  .school-badge svg { width: 16px; height: 16px; fill: var(--gold); }

  h1 {
    font-family: 'Playfair Display', serif;
    font-size: clamp(2.2rem, 5vw, 3.8rem);
    font-weight: 700;
    line-height: 1.1;
    background: linear-gradient(135deg, var(--gold-light) 0%, #fff 50%, var(--gold) 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    margin-bottom: 12px;
  }

  .subtitle {
    font-size: 1rem;
    color: var(--text-muted);
    letter-spacing: 1px;
    font-weight: 300;
  }

  .divider {
    display: flex;
    align-items: center;
    gap: 16px;
    max-width: 320px;
    margin: 28px auto 0;
    color: var(--gold);
    font-size: 0.7rem;
    letter-spacing: 4px;
  }
  .divider::before, .divider::after {
    content: '';
    flex: 1;
    height: 1px;
    background: linear-gradient(to right, transparent, var(--gold));
  }
  .divider::after { background: linear-gradient(to left, transparent, var(--gold)); }

  /* ── Search & Filter ── */
  .controls {
    position: relative;
    z-index: 1;
    max-width: 500px;
    margin: 0 auto 48px;
    padding: 0 20px;
  }

  .search-wrap {
    position: relative;
  }

  .search-wrap svg {
    position: absolute;
    left: 16px;
    top: 50%;
    transform: translateY(-50%);
    width: 18px;
    height: 18px;
    stroke: var(--text-muted);
    fill: none;
    stroke-width: 2;
    stroke-linecap: round;
  }

  #searchInput {
    width: 100%;
    padding: 14px 20px 14px 46px;
    background: var(--dark-card);
    border: 1px solid var(--dark-border);
    border-radius: 50px;
    color: var(--text-main);
    font-family: 'Lato', sans-serif;
    font-size: 0.95rem;
    outline: none;
    transition: border-color 0.3s, box-shadow 0.3s;
  }

  #searchInput:focus {
    border-color: var(--gold);
    box-shadow: 0 0 0 3px var(--shadow-gold);
  }

  #searchInput::placeholder { color: var(--text-muted); }

  /* ── Gallery grid ── */
  .gallery {
    position: relative;
    z-index: 1;
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
    gap: 28px;
    max-width: 1280px;
    margin: 0 auto;
    padding: 0 24px 80px;
  }

  /* ── Card ── */
  .teacher-card {
    position: relative;
    background: var(--dark-card);
    border: 1px solid var(--dark-border);
    border-radius: 20px;
    overflow: hidden;
    cursor: pointer;
    transition: transform 0.35s cubic-bezier(.22,.68,0,1.2), box-shadow 0.35s;
    animation: fadeUp 0.5s ease both;
  }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(24px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  .teacher-card:hover {
    transform: translateY(-8px) scale(1.02);
    box-shadow: 0 20px 50px rgba(0,0,0,0.5), 0 0 30px var(--shadow-gold);
    border-color: var(--gold);
  }

  .teacher-card:hover .card-glow { opacity: 1; }

  .card-glow {
    position: absolute;
    inset: 0;
    background: radial-gradient(ellipse at top, rgba(201,168,76,0.12), transparent 70%);
    opacity: 0;
    transition: opacity 0.4s;
    pointer-events: none;
    z-index: 1;
  }

  /* Image area */
  .img-wrap {
    position: relative;
    width: 100%;
    aspect-ratio: 3/3.5;
    overflow: hidden;
    background: linear-gradient(135deg, #1a1f2e, #0d1117);
  }

  .img-wrap img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    object-position: top center;
    transition: transform 0.5s ease, filter 0.4s;
    display: block;
  }

  .teacher-card:hover .img-wrap img {
    transform: scale(1.06);
    filter: brightness(1.1) saturate(1.1);
  }

  /* Fallback avatar */
  .img-wrap .avatar-fallback {
    display: none;
    width: 100%;
    height: 100%;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    gap: 12px;
    background: linear-gradient(135deg, #1a2035, #0d1117);
  }

  .avatar-fallback svg {
    width: 72px;
    height: 72px;
    fill: var(--gold);
    opacity: 0.5;
  }

  /* Badge overlay */
  .img-badge {
    position: absolute;
    top: 12px;
    right: 12px;
    background: rgba(13,17,23,0.75);
    backdrop-filter: blur(6px);
    border: 1px solid var(--gold);
    border-radius: 50px;
    padding: 4px 12px;
    font-size: 0.65rem;
    letter-spacing: 2px;
    color: var(--gold-light);
    text-transform: uppercase;
    z-index: 2;
  }

  /* Bottom overlay gradient */
  .img-overlay {
    position: absolute;
    bottom: 0;
    left: 0;
    right: 0;
    height: 60%;
    background: linear-gradient(to top, rgba(13,17,23,0.9), transparent);
    z-index: 2;
  }

  /* Info */
  .card-info {
    position: relative;
    z-index: 3;
    padding: 18px 20px 20px;
    text-align: center;
  }

  .teacher-name {
    font-family: 'Playfair Display', serif;
    font-size: 1.15rem;
    font-weight: 600;
    color: var(--text-main);
    margin-bottom: 6px;
    line-height: 1.3;
  }

  .sir-tag {
    color: var(--gold);
    font-style: italic;
  }

  .teacher-subject {
    font-size: 0.78rem;
    color: var(--text-muted);
    letter-spacing: 1.5px;
    text-transform: uppercase;
  }

  .separator-dot {
    display: inline-block;
    width: 4px;
    height: 4px;
    background: var(--gold);
    border-radius: 50%;
    margin: 10px auto;
  }

  /* Social row */
  .card-footer {
    display: flex;
    justify-content: center;
    gap: 10px;
    padding: 0 20px 18px;
  }

  .icon-btn {
    width: 32px;
    height: 32px;
    border-radius: 50%;
    background: rgba(255,255,255,0.04);
    border: 1px solid var(--dark-border);
    display: flex;
    align-items: center;
    justify-content: center;
    transition: background 0.2s, border-color 0.2s;
    cursor: pointer;
  }

  .icon-btn:hover {
    background: var(--shadow-gold);
    border-color: var(--gold);
  }

  .icon-btn svg { width: 14px; height: 14px; fill: var(--text-muted); transition: fill 0.2s; }
  .icon-btn:hover svg { fill: var(--gold); }

  /* ── Stats bar ── */
  .stats-bar {
    position: relative;
    z-index: 1;
    display: flex;
    justify-content: center;
    gap: 40px;
    max-width: 600px;
    width: fit-content;
    margin: 0 auto 40px;
    padding: 20px 40px;
    background: var(--dark-card);
    border: 1px solid var(--dark-border);
    border-radius: 16px;
  }

  .stat { text-align: center; }
  .stat-num {
    font-family: 'Playfair Display', serif;
    font-size: 1.8rem;
    font-weight: 700;
    color: var(--gold);
  }
  .stat-label {
    font-size: 0.72rem;
    color: var(--text-muted);
    letter-spacing: 1.5px;
    text-transform: uppercase;
    margin-top: 2px;
  }

  /* ── Empty state ── */
  #emptyState {
    display: none;
    text-align: center;
    padding: 80px 20px;
    color: var(--text-muted);
    grid-column: 1/-1;
  }

  #emptyState svg { width: 64px; height: 64px; fill: var(--dark-border); margin-bottom: 20px; }
  #emptyState p { font-size: 1.1rem; }

  /* ── Lightbox ── */
  #lightbox {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.88);
    backdrop-filter: blur(12px);
    z-index: 1000;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }

  #lightbox.active { display: flex; }

  .lb-inner {
    position: relative;
    background: var(--dark-card);
    border: 1px solid var(--gold);
    border-radius: 24px;
    max-width: 420px;
    width: 100%;
    overflow: hidden;
    box-shadow: 0 0 60px var(--shadow-gold), 0 40px 80px rgba(0,0,0,0.6);
    animation: lbIn 0.3s cubic-bezier(.22,.68,0,1.2);
  }

  @keyframes lbIn {
    from { opacity: 0; transform: scale(0.9); }
    to   { opacity: 1; transform: scale(1); }
  }

  .lb-img {
    width: 100%;
    aspect-ratio: 1;
    object-fit: cover;
    object-position: top;
    display: block;
  }

  .lb-body { padding: 28px 28px 32px; text-align: center; }
  .lb-name {
    font-family: 'Playfair Display', serif;
    font-size: 1.5rem;
    font-weight: 700;
    margin-bottom: 6px;
  }
  .lb-subject { color: var(--text-muted); font-size: 0.85rem; letter-spacing: 1px; }

  .lb-close {
    position: absolute;
    top: 14px;
    right: 14px;
    width: 36px;
    height: 36px;
    background: rgba(0,0,0,0.5);
    border: 1px solid var(--dark-border);
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    z-index: 10;
    transition: border-color 0.2s;
  }
  .lb-close:hover { border-color: var(--gold); }
  .lb-close svg { width: 16px; height: 16px; stroke: #fff; fill: none; stroke-width: 2; stroke-linecap: round; }

  /* ── Footer ── */
  footer {
    position: relative;
    z-index: 1;
    text-align: center;
    padding: 24px;
    border-top: 1px solid var(--dark-border);
    color: var(--text-muted);
    font-size: 0.8rem;
    letter-spacing: 1px;
  }

  footer span { color: var(--gold); }

  /* Responsive */
  @media(max-width: 480px) {
    .gallery { grid-template-columns: repeat(2, 1fr); gap: 14px; padding: 0 14px 60px; }
    .stats-bar { gap: 20px; margin-left: 14px; margin-right: 14px; }
  }
</style>
</head>
<body>

<header>
  <div class="school-badge">
    <svg viewBox="0 0 24 24"><path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/></svg>
    Faculty Directory
  </div>
  <h1>Our Honourable Teachers</h1>
  <p class="subtitle">Dedicated educators shaping tomorrow's leaders</p>
  <div class="divider">✦</div>
</header>

<!-- Stats -->
<div class="stats-bar" id="statsBar">
  <div class="stat">
    <div class="stat-num" id="totalCount">0</div>
    <div class="stat-label">Teachers</div>
  </div>
  <div class="stat">
    <div class="stat-num" id="deptCount">0</div>
    <div class="stat-label">Departments</div>
  </div>
  <div class="stat">
    <div class="stat-num">★★★★★</div>
    <div class="stat-label">Excellence</div>
  </div>
</div>

<!-- Search -->
<div class="controls">
  <div class="search-wrap">
    <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
    <input type="text" id="searchInput" placeholder="Search by name or subject…">
  </div>
</div>

<!-- Gallery -->
<div class="gallery" id="gallery">
  <div id="emptyState">
    <svg viewBox="0 0 24 24"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2M9 11a4 4 0 1 0 0-8 4 4 0 0 0 0 8zM23 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75"/></svg>
    <p>No teachers found matching your search.</p>
  </div>
</div>

<!-- Lightbox -->
<div id="lightbox">
  <div class="lb-inner">
    <div class="lb-close" id="lbClose">
      <svg viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
    </div>
    <img src="" alt="" class="lb-img" id="lbImg">
    <div class="lb-body">
      <div class="lb-name" id="lbName"></div>
      <div class="lb-subject" id="lbSubject"></div>
    </div>
  </div>
</div>

<footer>
  Designed with <span>♥</span> for Faculty Excellence &nbsp;|&nbsp; All images from <span>img/</span> folder
</footer>

<script>
// ─── CONFIG ────────────────────────────────────────────────────────────────
// Auto-scan the img/ folder. Since static HTML cannot read directory listings,
// we define the images here. The script extracts the teacher name from the filename.
//
// HOW IT WORKS:
//   1. Put teacher photos inside the  img/  folder (same directory as index.html).
//   2. Name the files like: "John Smith.jpg"  or  "Rahim Uddin.png"
//   3. The gallery reads the filename (without extension) as the teacher's name.
//   4. "Sir" is appended automatically after every name.
//   5. Optionally add subject info using the SUBJECTS map below.
//
// If you want fully automatic scanning without listing files, run this on
// a local server (e.g. Live Server in VS Code). A directory-listing server
// or a small fetch to a PHP/Node endpoint can return the file list.
// ──────────────────────────────────────────────────────────────────────────

const IMG_FOLDER = 'img/';
const IMG_EXTENSIONS = ['jpg', 'jpeg', 'png', 'webp', 'gif', 'avif'];

// Optional: Map filename (without extension) → subject label
// Leave empty {} to skip subject display
const SUBJECTS = {
  // Example: "Rahim Uddin": "Mathematics",
  // "Karim Ahmed": "Physics",
  "Shah Alam": "English",
};

// ─── DEMO DATA ─────────────────────────────────────────────────────────────
// When no img/ folder is present, demo cards are shown so the layout is visible.
// Replace this list with actual filenames from your img/ folder
// OR delete demoTeachers entirely and rely on the scanImgFolder() auto-loader.

const demoTeachers = [
  { file: 'Shah Alam.png',  name: 'Shah Alam',    subject: 'English' },
  { file: 'teacher2.jpg',  name: 'Rahima Begum',   subject: 'English' },
  { file: 'teacher3.jpg',  name: 'Md. Hasan Ali',  subject: 'Physics' },
  { file: 'teacher4.jpg',  name: 'Farida Khanam',  subject: 'Chemistry' },
  { file: 'teacher5.jpg',  name: 'Jakir Hossain',  subject: 'Biology' },
  { file: 'teacher6.jpg',  name: 'Salma Akter',    subject: 'History' },
  { file: 'teacher7.jpg',  name: 'Nurul Islam',    subject: 'Geography' },
  { file: 'teacher8.jpg',  name: 'Nasrin Sultana', subject: 'Bangla' },
  { file: 'teacher9.jpg',  name: 'Rahima Begum',   subject: 'English' },
  { file: 'teacher10.jpg',  name: 'Md. Hasan Ali',  subject: 'Physics' },
  { file: 'teacher11.jpg',  name: 'Farida Khanam',  subject: 'Chemistry' },
  { file: 'teacher12.jpg',  name: 'Jakir Hossain',  subject: 'Biology' },
  { file: 'teacher13.jpg',  name: 'Salma Akter',    subject: 'History' },
  { file: 'teacher14.jpg',  name: 'Nurul Islam',    subject: 'Geography' },
  { file: 'teacher15.jpg',  name: 'Nasrin Sultana', subject: 'Bangla' },
  { file: 'teacher16.jpg',  name: 'Nasrin Sultana', subject: 'Bangla' },
  
  
  
  
  
  
];

// ─── STATE ─────────────────────────────────────────────────────────────────
let allTeachers = [];

// ─── NAME FROM FILENAME ─────────────────────────────────────────────────────
function nameFromFile(filename) {
  // Remove extension: "John Smith.jpg" → "John Smith"
  return filename.replace(/\.[^.]+$/, '').trim();
}

// ─── SUBJECT FROM NAME ──────────────────────────────────────────────────────
function subjectFor(name) {
  return SUBJECTS[name] || '';
}

// ─── TRY AUTO-SCAN via fetch (works on local dev servers) ──────────────────
async function scanImgFolder() {
  try {
    const res = await fetch(IMG_FOLDER);
    if (!res.ok) return null;
    const html = await res.text();
    // Parse directory listing (Apache / Nginx / live-server style)
    const parser = new DOMParser();
    const doc = parser.parseFromString(html, 'text/html');
    const links = [...doc.querySelectorAll('a[href]')]
      .map(a => a.getAttribute('href'))
      .filter(href => IMG_EXTENSIONS.some(ext => href.toLowerCase().endsWith('.' + ext)));
    if (links.length === 0) return null;
    return links.map(href => {
      const filename = href.split('/').pop();
      const name = nameFromFile(decodeURIComponent(filename));
      return { file: filename, name, subject: subjectFor(name) };
    });
  } catch {
    return null;
  }
}

// ─── BUILD CARD HTML ────────────────────────────────────────────────────────
function buildCard(teacher, idx) {
  const imgSrc = IMG_FOLDER + teacher.file;
  const delay = (idx % 12) * 60;

  return `
  <div class="teacher-card" data-name="${teacher.name}" data-subject="${teacher.subject}"
       style="animation-delay:${delay}ms"
       onclick="openLightbox('${imgSrc}','${teacher.name}','${teacher.subject}')">
    <div class="card-glow"></div>
    <div class="img-wrap">
      <img src="${imgSrc}" alt="${teacher.name}"
           onerror="this.style.display='none';this.nextElementSibling.style.display='flex'">
      <div class="avatar-fallback" style="display:none">
        <svg viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
      </div>
      <span class="img-badge">Faculty</span>
      <div class="img-overlay"></div>
    </div>
    <div class="card-info">
      <div class="teacher-name">${teacher.name} <span class="sir-tag">Sir</span></div>
      ${teacher.subject ? `<div class="separator-dot"></div><div class="teacher-subject">${teacher.subject}</div>` : ''}
    </div>
    <div class="card-footer">
      <div class="icon-btn" title="Profile">
        <svg viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
      </div>
      <div class="icon-btn" title="Email">
        <svg viewBox="0 0 24 24"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/></svg>
      </div>
      <div class="icon-btn" title="Phone">
        <svg viewBox="0 0 24 24"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07A19.5 19.5 0 0 1 4.69 13a19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 3.6 2.19h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L7.91 9.91a16 16 0 0 0 6.18 6.18l.91-.91a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 17z"/></svg>
      </div>
    </div>
  </div>`;
}

// ─── RENDER ─────────────────────────────────────────────────────────────────
function renderGallery(list) {
  const gallery = document.getElementById('gallery');
  const empty = document.getElementById('emptyState');

  if (list.length === 0) {
    empty.style.display = 'block';
    gallery.querySelectorAll('.teacher-card').forEach(c => c.remove());
    return;
  }

  empty.style.display = 'none';
  gallery.querySelectorAll('.teacher-card').forEach(c => c.remove());
  list.forEach((t, i) => gallery.insertAdjacentHTML('beforeend', buildCard(t, i)));
}

// ─── SEARCH ─────────────────────────────────────────────────────────────────
document.getElementById('searchInput').addEventListener('input', function () {
  const q = this.value.toLowerCase().trim();
  const filtered = allTeachers.filter(t =>
    t.name.toLowerCase().includes(q) || t.subject.toLowerCase().includes(q)
  );
  renderGallery(filtered);
});

// ─── LIGHTBOX ───────────────────────────────────────────────────────────────
function openLightbox(src, name, subject) {
  document.getElementById('lbImg').src = src;
  document.getElementById('lbName').innerHTML = `${name} <span style="color:var(--gold);font-style:italic">Sir</span>`;
  document.getElementById('lbSubject').textContent = subject || 'Faculty Member';
  document.getElementById('lightbox').classList.add('active');
}

document.getElementById('lbClose').onclick = () => document.getElementById('lightbox').classList.remove('active');
document.getElementById('lightbox').onclick = (e) => {
  if (e.target === document.getElementById('lightbox')) document.getElementById('lightbox').classList.remove('active');
};
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') document.getElementById('lightbox').classList.remove('active');
});

// ─── STATS ──────────────────────────────────────────────────────────────────
function updateStats(teachers) {
  document.getElementById('totalCount').textContent = teachers.length;
  const depts = new Set(teachers.map(t => t.subject).filter(Boolean));
  document.getElementById('deptCount').textContent = depts.size || teachers.length;
}

// ─── INIT ───────────────────────────────────────────────────────────────────
async function init() {
  // Try to auto-scan the img/ folder via fetch
  const scanned = await scanImgFolder();

  if (scanned && scanned.length > 0) {
    allTeachers = scanned;
  } else {
    // Fall back to demo data
    allTeachers = demoTeachers;
  }

  renderGallery(allTeachers);
  updateStats(allTeachers);
}

init();
</script>
