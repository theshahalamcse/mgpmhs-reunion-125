<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<title>Admit Card</title>

<style>
body {
    background: #f0f2f5;
}

/* A5 size */
#admitCard {
    width: 148mm;
    height: 210mm;
    background: linear-gradient(135deg, #4facfe, #00f2fe);
    position: relative;
    overflow: hidden;
    margin: auto;
    padding: 20px;
    color: #000;
}

/* Complex pattern overlay */
#admitCard::before {
    content: "";
    position: absolute;
    width: 200%;
    height: 200%;
    background-image: repeating-linear-gradient(
        45deg,
        rgba(255,255,255,0.1) 0px,
        rgba(255,255,255,0.1) 2px,
        transparent 2px,
        transparent 20px
    );
    transform: rotate(10deg);
}

/* Watermark */
.watermark {
    position: absolute;
    top: 40%;
    left: 10%;
    font-size: 60px;
    color: rgba(255,255,255,0.2);
    transform: rotate(-30deg);
    pointer-events: none;
}

/* Card content */
.card-box {
    background: rgba(255,255,255,0.9);
    border-radius: 15px;
    padding: 20px;
    position: relative;
    z-index: 2;
}

/* Header */
.header {
    text-align: center;
    font-weight: bold;
}

.qr {
    width: 100px;
    height: 100px;
}
</style>
</head>

<body>

<div class="container mt-4 text-center">
    <button class="btn btn-primary" onclick="downloadPDF()">Download Admit Card</button>
</div>

<div id="admitCard" class="mt-3 shadow">

    <div class="watermark">ADMIT CARD</div>

    <div class="card-box">

        <div class="header">
            <h3>XYZ College</h3>
            <h5>Admit Card 2026</h5>
        </div>

        <hr>

        <div class="row">
            <div class="col-8">
                <p><b>Name:</b> <span id="name">Shah Alam</span></p>
                <p><b>ID:</b> <span id="id">123456</span></p>
                <p><b>Exam:</b> Final Exam</p>
                <p><b>Date:</b> 25 April 2026</p>
            </div>

            <div class="col-4 text-end">
                <img src="https://api.qrserver.com/v1/create-qr-code/?size=100x100&data=123456"
                     class="qr">
            </div>
        </div>

        <hr>

        <p class="text-center text-muted">
            This card is generated for one user only
        </p>

    </div>
</div>

<script>
function downloadPDF() {
    window.print();
}

/* OPTIONAL: simple device binding (basic) */
const userId = "123456";
const deviceKey = "device_" + userId;

if (!localStorage.getItem(deviceKey)) {
    localStorage.setItem(deviceKey, navigator.userAgent);
} else {
    if (localStorage.getItem(deviceKey) !== navigator.userAgent) {
        document.body.innerHTML = "<h2 class='text-center mt-5'>Access Denied: Different Device</h2>";
    }
}
</script>

</body>
</html>
