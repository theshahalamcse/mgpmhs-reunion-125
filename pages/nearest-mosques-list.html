<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mosque List - Murapara</title>

    <!-- Bootstrap CDN -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <style>
      body {
        background: #f5f7fb;
      }

      .header {
        background: linear-gradient(135deg, #0d6efd, #20c997);
        color: white;
        padding: 25px 15px;
        border-radius: 0 0 20px 20px;
      }

      .card {
        border: none;
        border-radius: 15px;
        transition: 0.3s;
      }

      .card:hover {
        transform: translateY(-3px);
        box-shadow: 0 10px 20px rgba(0, 0, 0, 0.1);
      }

      .mosque-name {
        font-weight: 600;
      }
    </style>
  </head>

  <body>
    <div class="header text-center">
      <h2>🕌 Murapara Mosque List</h2>
      <p>Rupganj, Narayanganj</p>
    </div>

    <div class="container my-4">
      <!-- Search Box -->
      <input
        type="text"
        id="searchBox"
        class="form-control mb-4"
        placeholder="Search mosque..."
      />

      <div class="row" id="mosqueContainer">
        <!-- Cards will be generated by JS -->
      </div>
    </div>

    <script>
      const mosques = [
        {
          name: "মুড়াপাড়া শাহী মসজিদ",
          address: "মুড়াপাড়া বাজার রোড, রূপগঞ্জ, নারায়ণগঞ্জ",
        },
        {
          name: "মুড়াপাড়া নামা বাজার জামে মসজিদ",
          address: "নামা বাজার, রূপগঞ্জ",
        },
        {
          name: "মঙ্গলখালী পশ্চিমপাড়া জামে মসজিদ",
          address: "বেবি স্ট্যান্ড সংলগ্ন, রূপগঞ্জ",
        },
        {
          name: "উপজেলা কমপ্লেক্স জামে মসজিদ",
          address: "উপজেলা কমপ্লেক্স, রূপগঞ্জ",
        },
        { name: "নুর-রশীদিয়া জামে মসজিদ", address: "শিবগঞ্জ, রূপগঞ্জ" },
        { name: "সরকার পাড়া জামে মসজিদ", address: "মুড়াপাড়া, রূপগঞ্জ" },
        {
          name: "দড়িকান্দি কুলিনপাড়া জামে মসজিদ",
          address: "দড়িকান্দি, রূপগঞ্জ",
        },
        {
          name: "দড়িকান্দি কেন্দ্রীয় জামে মসজিদ",
          address: "দড়িকান্দি কেন্দ্রীয় এলাকা",
        },
        { name: "বাইতুল ফালাহ জামে মসজিদ", address: "গঙ্গানগর, রূপগঞ্জ" },
        { name: "বাইতুল আমান জামে মসজিদ", address: "গঙ্গানগর কবরস্থান সংলগ্ন" },
      ];

      const container = document.getElementById("mosqueContainer");

      function displayMosques(list) {
        container.innerHTML = "";
        list.forEach((m) => {
          container.innerHTML += `
        <div class="col-12 col-md-6 col-lg-4 mb-3">
            <div class="card p-3">
                <div class="mosque-name">🕌 ${m.name}</div>
                <div class="text-muted">📍 ${m.address}</div>
            </div>
        </div>
        `;
        });
      }

      displayMosques(mosques);

      // Search filter
      document
        .getElementById("searchBox")
        .addEventListener("input", function () {
          let value = this.value.toLowerCase();
          let filtered = mosques.filter(
            (m) =>
              m.name.toLowerCase().includes(value) ||
              m.address.toLowerCase().includes(value),
          );
          displayMosques(filtered);
        });
    </script>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
