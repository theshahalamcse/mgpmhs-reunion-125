<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<title>Admission System</title>

<style>
body {
    background:#eef2f7;
}

/* A5 Card */
#card {
    width:148mm;
    height:210mm;
    background:linear-gradient(135deg,#667eea,#764ba2);
    color:#000;
    display:none;
    position:relative;
    margin:auto;
    overflow:hidden;
}

/* pattern */
#card::before {
    content:"";
    position:absolute;
    width:100%;
    height:100%;
    background:
    linear-gradient(rgba(255,255,255,0.12) 1px, transparent 1px),
    linear-gradient(90deg, rgba(255,255,255,0.12) 1px, transparent 1px);
    background-size:25px 25px;
}

/* watermark */
.watermark {
    position:absolute;
    top:40%;
    left:10%;
    font-size:60px;
    color:white;
    opacity:0.15;
    transform:rotate(-30deg);
}

/* content box */
.box {
    position:relative;
    z-index:2;
    background:white;
    margin:20px;
    padding:15px;
    border-radius:10px;
}

/* preview image */
.preview {
    width:100px;
    height:100px;
    object-fit:cover;
    border:2px solid #ccc;
}
</style>
</head>

<body class="container mt-3">

<h3>Transaction Verification</h3>

<input id="trx" class="form-control" placeholder="Enter Transaction ID">
<button class="btn btn-primary mt-2" onclick="verify()">Verify</button>

<hr>

<div id="form" style="display:none">

    <h5>Passport Photo</h5>
    <input type="file" id="photo" class="form-control" onchange="loadImg(event,'p')">
    <img id="p" class="preview mt-2">

    <hr>

    <h5>Do you have NID?</h5>
    <select class="form-control" id="nidSelect" onchange="toggle()">
        <option value="">Select</option>
        <option value="yes">Yes</option>
        <option value="no">No</option>
    </select>

    <div id="nidBox" class="mt-2" style="display:none">
        <h6>NID Front</h6>
        <input type="file" class="form-control" id="nid" onchange="loadImg(event,'n')">
        <img id="n" class="preview mt-2">
    </div>

    <div id="guardianBox" class="mt-2" style="display:none">
        <h6>Guardian NID</h6>
        <input type="file" class="form-control" id="guardian" onchange="loadImg(event,'g')">
        <img id="g" class="preview mt-2">
    </div>

    <button class="btn btn-success mt-3" onclick="generate()">
        Generate Admit Card PDF
    </button>

</div>

<!-- CARD -->
<div id="card" class="mt-4">

    <div class="watermark">ADMIT CARD</div>

    <div class="box">
        <h4 class="text-center">Admit Card</h4>
        <hr>

        <p><b>Transaction:</b> <span id="trxShow"></span></p>

        <p><b>Passport:</b></p>
        <img id="cardPhoto" class="preview">

        <p><b>NID / Guardian:</b></p>
        <img id="cardNid" class="preview">

        <hr>

        <button class="btn btn-primary w-100" onclick="window.print()">
            Download PDF
        </button>
    </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

<script>

let photoData = "";
let nidData = "";
let guardianData = "";

function verify() {
    const trx = document.getElementById("trx").value;

    const valid = ["TXN123", "TXN456"];

    if (valid.includes(trx)) {
        document.getElementById("form").style.display = "block";
        document.getElementById("trxShow").innerText = trx;
    } else {
        alert("Invalid Transaction ID");
    }
}

function toggle() {
    let val = document.getElementById("nidSelect").value;

    if (val === "yes") {
        document.getElementById("nidBox").style.display = "block";
        document.getElementById("guardianBox").style.display = "none";
    } else {
        document.getElementById("guardianBox").style.display = "block";
        document.getElementById("nidBox").style.display = "none";
    }
}

function loadImg(e, id) {
    const file = e.target.files[0];
    const reader = new FileReader();

    reader.onload = function () {
        document.getElementById(id).src = reader.result;

        if (id === "p") photoData = reader.result;
        if (id === "n") nidData = reader.result;
        if (id === "g") guardianData = reader.result;
    };

    reader.readAsDataURL(file);
}

async function generate() {

    let nidType = document.getElementById("nidSelect").value;

    if (!photoData) return alert("Passport required");

    if (nidType === "yes" && !nidData) {
        return alert("NID required");
    }

    if (nidType === "no" && !guardianData) {
        return alert("Guardian NID required");
    }

    document.getElementById("card").style.display = "block";

    document.getElementById("cardPhoto").src = photoData;

    if (nidType === "yes") {
        document.getElementById("cardNid").src = nidData;
    } else {
        document.getElementById("cardNid").src = guardianData;
    }
}

</script>

</body>
</html>
